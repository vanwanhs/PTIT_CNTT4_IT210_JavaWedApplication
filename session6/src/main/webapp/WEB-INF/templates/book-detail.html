<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="main-layout">

<div layout:fragment="content">

    <h2>Chi tiết sách</h2>

    <p>ID: <span th:text="${book.id}"></span></p>
    <p>Tên: <span th:text="${book.name}"></span></p>
    <p>Tác giả: <span th:text="${book.author}"></span></p>
    <p>Giá: <span th:text="${book.price}"></span></p>

    <a th:href="@{/books}">Quay lại</a>

</div>

</html>
