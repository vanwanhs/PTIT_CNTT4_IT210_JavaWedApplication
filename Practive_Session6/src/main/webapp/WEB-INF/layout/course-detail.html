<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main-layout}">

<div layout:fragment="content">

  <h2 th:text="${course.name}"></h2>

  <p th:text="${course.description}"></p>

  <p>
    Instructor:
    <b th:text="${course.instructor}"></b>
  </p>

  <p>
    Duration:
    <span th:text="${course.duration}"></span> weeks
  </p>

  <span th:if="${course.full}"
        style="color:red;font-weight:bold;font-size:18px">
HẾT CHỖ
</span>

</div>
</html>
